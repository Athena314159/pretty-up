<div class="sky" aria-hidden="true"></div><header class="header"><a class="brand" href="#" id="homeLink"><span>✧</span> 星迹 <small>热点搜索</small></a><nav aria-label="主导航"><button id="historyBtn" class="quiet">我的任务</button><button id="newBtn" class="quiet">＋ 新任务</button><button id="moreBtn" class="round" aria-label="更多选项">···</button></nav></header>
<main><section id="welcome" class="welcome"><span class="eyebrow">工作与学习，都从一个清楚的问题开始</span><h1>说出任务，<em>找到可用的答案。</em></h1><p>上传资料，获得研究方案、分步 Prompt 和可追溯的成果。</p></section>
<section class="composer" aria-label="提交任务"><form id="taskForm"><div class="composer-head"><div class="mode" role="group" aria-label="使用场景"><button type="button" data-mode="work" aria-pressed="true">工作</button><button type="button" data-mode="study" aria-pressed="false">学习</button></div><span id="editingLabel" class="muted">先告诉我，你要完成什么</span></div><label class="sr" for="request">任务描述</label><textarea id="request" required maxlength="6000" placeholder="例如：调研近三个月升温最快的包袋风格，整理有来源的案例，帮助我完成课程设计。"></textarea><div id="fileList" class="file-list"></div><div id="fileProgress" class="file-progress" role="status" hidden></div><div id="dropZone" class="composer-actions"><div><button type="button" id="attachBtn" class="attach">＋ 添加图片或文件</button><span class="drag-hint">也可直接拖入</span></div><button type="submit" class="primary" id="generateBtn">生成研究方案 <span>↗</span></button></div><details class="options"><summary>交付要求 <span id="optionSummary">研究简报 · 近期上升与历史对照</span></summary><div class="option-grid"><label>希望拿到什么<select id="deliverable"><option>研究简报</option><option>带图案例库</option><option>课程作业方案</option><option>竞品对比与建议</option><option>按附件要求交付</option></select></label><label>任务模板<select id="profile"><option value="general">通用研究</option><option value="bag-design">包袋课程 · 优化版流程</option></select></label><label class="wide">重点或限制<input id="focus" maxlength="500" placeholder="例如：侧重版型、材质与配色；不做用户调查"></label></div></details></form><input id="attachmentInput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.csv,.tsv,.json" hidden></section>
<div id="starter" class="starter"><span>试一个任务</span><button data-example="work">竞品调研 ↗</button><button data-example="study">课程作业 ↗</button><button data-example="bag">包袋设计 ↗</button></div>
<section id="workspace" hidden><div class="project-heading"><div><span class="eyebrow">当前任务</span><h2 id="projectTitle"></h2></div><button id="editTask" class="quiet">编辑要求</button></div><section class="progress-panel" aria-label="当前进度"><div class="progress-caption"><strong id="stageLabel"></strong><span id="stageTime"></span></div><ol id="stageStrip" class="stage-strip"></ol><p id="stageDetail"></p></section>
<div class="workspace-grid"><section class="main-column" aria-label="方案与成果"><div class="results-heading"><h2>方案与成果</h2><span id="resultCount"></span></div><div id="resultCards"></div><section class="prompt-library"><details id="promptLibrary"><summary><div><span class="section-icon">⌘</span><strong>分步执行 Prompt</strong><small id="promptSubtitle"></small></div><span class="disclosure">点击查看 ＋</span></summary><div id="promptParts"></div></details></section></section><aside><section class="next-card"><span class="eyebrow">下一步</span><h3 id="nextTitle">把方案交给 Codex 执行</h3><p id="nextText">复制执行任务，或导出包含附件的任务包。</p><button id="copyTask" class="primary">复制执行任务</button><button id="exportTask" class="secondary">导出任务包</button><span class="local-note">当前页面生成方案与 Prompt。联网研究需在 Codex 执行，返回后导入成果。</span></section><details class="reference-card"><summary>任务资料与质量要求</summary><div id="qualityInfo"></div><button id="importResults" class="quiet">导入执行成果 ↗</button></details></aside></div></section>
<footer class="footer"><span id="saveStatus">资料仅保存于当前浏览器</span><button id="helpBtn" class="quiet">使用说明</button></footer></main>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" class="round" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><input id="importInput" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div><script>(()=>{const KINDS=['tasks','sources','searches','observations','deliveries'];
function emptyState(){return {schema_version:1,...Object.fromEntries(KINDS.map(k=>[k,[]]))};}
function canonicalURL(raw){const u=new URL(raw);if(!['https:','http:'].includes(u.protocol)||u.username||u.password)throw Error('请使用不含登录凭据的 http/https 链接');u.hash='';for(const k of [...u.searchParams.keys()])if(k.toLowerCase().startsWith('utm_')||['fbclid','gclid','igshid','xsec_token','xsec_source','spm'].includes(k.toLowerCase()))u.searchParams.delete(k);u.searchParams.sort();return u.href;}
function day(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function monthsAgo(date,n){const d=new Date(date);const targetDay=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(targetDay,last));return day(d);}

function mergeBundle(state,incoming){const out=structuredClone(state);const remap=new Map();for(const k of ['sources','tasks','searches','observations','deliveries']){for(const r0 of incoming[k]){const r={...r0};if(r.source_id)r.source_id=remap.get(r.source_id)||r.source_id;const idx=out[k].findIndex(x=>k==='sources'?canonicalURL(x.url)===r.canonical_url:x.id===r.id);if(idx>=0){const old=out[k][idx];if(k==='observations'){if(JSON.stringify(old)!==JSON.stringify(r))throw Error('快照编号冲突，请保留旧记录并使用新编号');continue;}if(k==='sources'){remap.set(r.id,old.id);r.id=old.id;r.task_ids=[...new Set([...(old.task_ids||[]),...(r.task_ids||[])])];if(old.verification==='verified'&&r.verification==='lead')r.verification='verified';}out[k][idx]=k==='tasks'?mergeTask(old,r):{...old,...r};}else{if(out[k].some(x=>x.id===r.id))throw Error('编号对应不同来源，请修正后导入');out[k].push(r);}}}for(const o of out.observations)if(!out.sources.some(s=>s.id===o.source_id))throw Error('快照引用不存在的来源');return out;}

function mergeTask(old,incoming){const next={...old,...incoming};for(const field of ['workflow_progress']){if(old[field]||incoming[field]){next[field]={...old[field]};for(const [key,row] of Object.entries(incoming[field]||{})){const prior=old[field]?.[key];next[field][key]=prior?.updated_at&&row.updated_at&&prior.updated_at>row.updated_at?prior:{...prior,...row};}}}for(const field of ['results','attachments'])if(old[field]||incoming[field]){const rows=new Map((old[field]||[]).map(r=>[r.id,r]));for(const r of incoming[field]||[]){const prior=rows.get(r.id);rows.set(r.id,prior?.updated_at&&r.updated_at&&prior.updated_at>r.updated_at?prior:{...prior,...r});}next[field]=[...rows.values()];}return next;}

function storedZip(entries){const encoder=new TextEncoder(),parts=[],central=[];let offset=0;
const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0;}
for(const entry of entries){const name=encoder.encode(entry.name),bytes=entry.bytes;let crc=0xffffffff;for(const b of bytes)crc=table[(crc^b)&255]^(crc>>>8);crc=(crc^0xffffffff)>>>0;const local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,name.length,true);local.set(name,30);parts.push(local,bytes);const cd=new Uint8Array(46+name.length),w=new DataView(cd.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint32(16,crc,true);w.setUint32(20,bytes.length,true);w.setUint32(24,bytes.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);cd.set(name,46);central.push(cd);offset+=local.length+bytes.length;}
const size=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'});}

async function addFiles(files){const list=fileContext(),batch=[...files],label=$('#fileProgress');label.hidden=false;$('#generateBtn').disabled=true;let done=0,saved=0;for(const file of batch){label.innerHTML=`正在保存 ${done+1}/${batch.length}：${escapeHTML(file.name)}<progress max="${batch.length}" value="${done}"></progress>`;try{if(list.length>=20)throw Error('每任务最多20份附件');if(file.size>25*1048576)throw Error('单文件上限25MB');if(list.reduce((n,x)=>n+x.size,0)+file.size>50*1048576)throw Error('任务附件总量上限50MB');const kind=fileKind(file),bytes=await file.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');if(list.some(x=>x.sha256===hash)){done++;continue;}const key=id();await saveLocalFile(key,file);list.push({id:key,name:file.name,size:file.size,type:file.type,kind,sha256:hash,created_at:new Date().toISOString()});saved++;}catch(err){toast(file.name+'：'+err.message);}done++;}persist();await renderFiles();label.innerHTML=`已保存 ${saved} 份附件，仅保存在当前浏览器。<progress max="${batch.length}" value="${done}"></progress>`;$('#generateBtn').disabled=false;}
async function renderFiles(){thumbURLs.forEach(url=>URL.revokeObjectURL(url));thumbURLs=[];const list=fileContext(),target=$('#fileList');target.innerHTML=list.map(f=>`<div class="file-chip"><span data-thumb="${escapeHTML(f.id)}">${f.kind==='image'?'▧':'▤'}</span><div><button type="button" data-preview="${escapeHTML(f.id)}" title="预览 ${escapeHTML(f.name)}">${escapeHTML(f.name)}</button><small>${fileSize(f.size)}</small></div><button type="button" data-remove="${escapeHTML(f.id)}" aria-label="移除 ${escapeHTML(f.name)}">×</button></div>`).join('');$$('[data-preview]').forEach(b=>b.onclick=()=>previewFile(b.dataset.preview));$$('[data-remove]').forEach(b=>b.onclick=()=>{if(active)active.attachments=(active.attachments||[]).filter(f=>f.id!==b.dataset.remove);else draftFiles=draftFiles.filter(f=>f.id!==b.dataset.remove);persist();renderFiles();});for(const meta of list.filter(f=>f.kind==='image')){try{const file=await readLocalFile(meta.id);const node=$$('[data-thumb]').find(n=>n.dataset.thumb===meta.id);if(!node||!file)continue;const url=URL.createObjectURL(file);thumbURLs.push(url);const image=document.createElement('img');image.src=url;image.alt=meta.name;node.replaceWith(image);}catch{}}}
async function previewFile(key){const meta=fileContext().find(f=>f.id===key);if(!meta)return;try{const file=await readLocalFile(key);if(!file){toast('未找到原文件，请重新添加。');return;}modal(meta.name,'<div id="previewBody"></div><div class="dialog-actions"><button id="downloadOriginal" class="secondary">下载原文件</button></div>');if(meta.kind==='image'){const image=document.createElement('img'),url=URL.createObjectURL(file);image.src=url;image.alt=meta.name;image.className='preview';$('#previewBody').append(image);$('#dialog').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true});}else if(meta.kind==='text'){const pre=document.createElement('pre');pre.className='prompt-text';pre.textContent=(await file.slice(0,100000).text())+(file.size>100000?'\n…仅预览前100KB':'');$('#previewBody').append(pre);}else $('#previewBody').innerHTML='<p>文件已保存。导出任务包后交给 Codex 读取；当前页面未解析此文档。</p>';$('#downloadOriginal').onclick=()=>saveBlob(file,meta.name);}catch(err){toast('文件读取失败：'+err.message);}}
$('#attachBtn').onclick=()=>$('#attachmentInput').click();$('#attachmentInput').onchange=e=>{addFiles(e.target.files);e.target.value='';};const drop=$('#taskForm');drop.ondragover=e=>{e.preventDefault();$('#dropZone').classList.add('dragover');};drop.ondragleave=()=>$('#dropZone').classList.remove('dragover');drop.ondrop=e=>{e.preventDefault();$('#dropZone').classList.remove('dragover');addFiles(e.dataTransfer.files);};
